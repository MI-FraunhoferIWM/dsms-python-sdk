---
repos:

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-json
          - id: check-yaml
          - id: pretty-format-json
            args:
            - --autofix
            exclude: '\.ipynb$'
          - id: end-of-file-fixer
          - id: trailing-whitespace

    - repo: https://github.com/psf/black
      rev: 26.5.1
      hooks:
          - id: black
            args: [--line-length, "79"]

    - repo: https://github.com/pycqa/isort
      rev: 8.0.1
      hooks:
          - id: isort
            args: [--profile, black, --filter-files, --line-length, "79"]

    - repo: https://github.com/asottile/pyupgrade
      rev: v3.21.2
      hooks:
          - id: pyupgrade
            args: [--py38-plus]

    - repo: https://github.com/PyCQA/flake8
      rev: 7.3.0
      hooks:
          - id: flake8
            args: [--count, --show-source, --statistics, '--ignore', 'E501,E203,W503,E201,E202,E221,E222,E231,E241,E271,E272,E702,E713']
            # additional_dependencies: [flake8-bugbear==21.3.1, pep8-naming]
            log_file: flake8.log

    - repo: https://github.com/asottile/setup-cfg-fmt
      rev: v3.2.0
      hooks:
          - id: setup-cfg-fmt

    - repo: https://github.com/PyCQA/bandit
      rev: 1.9.4
      hooks:
      - id: bandit
        args: ["-r"]
        files: ^(dsms)/.*

    - repo: local
      hooks:
      - id: pylint
        name: pylint
        entry: pylint
        args: ["--rcfile=.pylintrc", "--extension-pkg-whitelist=pydantic"]
        language: system
        types: [python]
        require_serial: true
        files: ^(dsms)/.*